    function useReveal() {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.unobserve(el);
            }
          },
          { threshold: 0.12 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      return [ref, visible];
    }

        >

                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-xl bg-brand text-white font-semibold text-sm hover:bg-brandDark transition shadow-md shadow-brand/20"
                  >
                    Compose Email Inquiry →
                  </button>
                </form>
              </div>
            </section>
          </main>

          <footer className="border-t border-slate-200/80 bg-white py-8 text-center text-xs font-mono text-slate-500">
            © 2026 Gurpreet Singh • Built with React 18 &amp; Tailwind CSS
          </footer>

          {/* React Architecture Modal */}
          {selectedProject && (
            <div
              onClick={(e) => {
                if (e.target === e.currentTarget) setSelectedProject(null);
              }}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy/50 backdrop-blur-sm"
            >
              <div className="bg-white max-w-xl w-full rounded-2xl border border-slate-200 shadow-2xl p-6 sm:p-8 relative animate-fade-up">
                <button
                  type="button"
                  onClick={() => setSelectedProject(null)}
                  aria-label="Close modal"
                  className="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-mono text-sm transition"
                >
                  ✕
                </button>
                <span className="text-xs font-mono font-semibold text-brand uppercase tracking-wider">
                  {selectedProject.badge}
                </span>
                <h3 className="text-xl sm:text-2xl font-extrabold text-navy mt-1">{selectedProject.title}</h3>
                <p className="text-sm text-slate-600 mt-3 leading-relaxed">{selectedProject.summary}</p>

                <div className="mt-5 pt-5 border-t border-slate-100">
                  <p className="text-xs font-mono uppercase tracking-wider text-slate-400 font-semibold mb-3">
                    Technical Implementation Highlights
                  </p>
                  <ul className="space-y-2.5 text-sm text-slate-700">
                    {selectedProject.highlights.map((item) => (
                      <li key={item} className="flex items-start gap-2.5">
                        <span className="text-mint font-bold mt-0.5">✓</span>
                        <span>{item}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                  <span className="text-xs font-mono font-bold text-mint">{selectedProject.outcome}</span>
                  <a
                    href="#contact"
                    onClick={() => setSelectedProject(null)}
                    className="text-xs font-semibold px-4 py-2.5 rounded-xl bg-brand text-white hover:bg-brandDark transition"
                  >
                    Discuss Similar Build
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
